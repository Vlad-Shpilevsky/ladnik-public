  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "2d663564f9904149ad288e037a0ce07c"}'></script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F5F9;color:#251A65;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:0 16px}

<body>
  <p>Opening Google Play…<br /><a id="go" href="https://play.google.com/store/apps/details?id=com.vladshpilevsky.ladnik&amp;utm_source=ladnik.app&amp;utm_medium=website&amp;utm_campaign=footer" rel="noopener">Open LADNIK in Google Play</a></p>
  <script>
    // Leave once the beacon has loaded (it reports on load and on pagehide),
    // or after 2.5 s on a slow network: the visitor is never kept waiting long.
    (function () {
      var url = document.getElementById('go').href, started = Date.now(), gone = false;
      function go() { if (!gone) { gone = true; location.replace(url); } }
      var b = document.querySelector('script[data-cf-beacon]');
      if (b) b.addEventListener('load', function () { setTimeout(go, Math.max(0, 400 - (Date.now() - started))); });
      setTimeout(go, 2500);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=https://play.google.com/store/apps/details?id=com.vladshpilevsky.ladnik&amp;utm_source=ladnik.app&amp;utm_medium=website&amp;utm_campaign=footer" /></noscript>
