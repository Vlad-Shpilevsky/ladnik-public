<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help · LADNIK</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://ladnik.app/help/">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script>
/* The former WIKI moved to /help/ (EN) and /help/ru/ (RU). Keep old links,
   their language and their section working. */
(function () {
  var lang = new URLSearchParams(location.search).get('lang');
  if (lang !== 'ru' && lang !== 'en') {
    try { lang = localStorage.getItem('ladnik-language'); } catch (e) { lang = null; }
  }
  if (lang !== 'ru' && lang !== 'en') {
    lang = (navigator.languages || [navigator.language || '']).some(function (l) { return /^ru\b/i.test(l); }) ? 'ru' : 'en';
  }
  var sections = {start: 'start', spaces: 'spaces', tasks: 'tasks', notes: 'notes', money: 'finance',
    daily: 'notes', assistant: 'assistant', settings: 'notifications'};
  var section = sections[location.hash.slice(1)];
  location.replace((lang === 'ru' ? 'help/ru/' : 'help/') + (section ? '#' + section : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=help/"></noscript>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main class="container artifact-index">
<h1>LADNIK</h1>
<ul class="pages"><li><a href="help/">Help</a></li><li><a href="help/ru/" lang="ru">Справка</a></li></ul>
</main>
</body>
</html>
