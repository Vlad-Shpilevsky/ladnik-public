  --line:#cfc7de;
  --light:#f1eef6;
  --orange-deep:#ac410a;
}
body{background:#f5f2fa}
.site-header{background:rgba(255,255,255,.98);border-bottom:1px solid #d4ccdf;box-shadow:0 3px 15px #251a650b}

function assistant(){return `<div class="phone-subtabs"><button class="${state.assistantTab==='chat'?'active':''}" data-action="chat">${T('Chat','Чат')}</button><button class="${state.assistantTab==='automation'?'active':''}" data-action="automations">${T('Automations','Автоматизации')}</button></div>${state.assistantTab==='automation'?automation(true):`<div class="phone-assistant-lead">${I('sparkle')} <span>${T('Ask about tasks, plans or your schedule','Спросите о задачах, планах или расписании')}</span></div><div class="phone-chat-log">${(state.chatMessages.length?state.chatMessages:[{from:'mine',en:'What is on my schedule this week?',ru:'Что у нас на неделе?'},{from:'bot',en:'3 tasks, 1 overdue. Weekly expenses: 48.30 $.',ru:'3 задачи, 1 просрочена. Расходы за неделю — 48,30 $.'}]).map(m=>`<div class="phone-bubble ${m.from==='mine'?'mine':''}">${txt(state.lang==='ru'?m.ru:m.en)}</div>`).join('')}</div><form id="phone-chat-form" class="phone-chat-form"><input id="phone-chat-input" type="text" maxlength="180" autocomplete="off" placeholder="${T('Ask LADNIK…','Спросите LADNIK…')}" aria-label="${T('Message','Сообщение')}" required/><button type="submit" aria-label="${T('Send message','Отправить сообщение')}">${I('arrow')}</button></form>`}`}

function profile(){return `<div class="phone-row" style="padding:14px 0 12px">${av('A','gray')}<div style="flex:1"><div class="phone-text-strong" style="font-size:13px">${T('Anna Smirnova','Анна Смирнова')}</div><div class="phone-meta">@anna · ${T('connected account','связанный аккаунт')}</div></div>${I('edit')}</div><div class="phone-money" style="margin-top:0;margin-bottom:10px;padding:12px"><div class="phone-row">${mini('crown')}<div><div class="phone-text-strong" style="color:#fff">LADNIK</div><div class="phone-meta" style="color:#d3cbea">${T('Spaces, tools and widgets','Пространства, инструменты и виджеты')}</div></div>${I('chevron')}</div></div>${group([line('settings',T('Appearance','Оформление'),T('Light · orange','Светлая · оранжевый'),'appearance'),line('globe',T('Language & region','Язык и регион'),T('English · Europe','Русский · Europe/Minsk'),'toast-demo'),line('bell',T('Notifications','Уведомления'),'','inbox')])}${group([line('users',T('Connected users','Связанные пользователи'),'','toast-demo'),line('inbox',T('Archive','Архив'),'','toast-demo'),line('lock',T('Privacy & policies','Конфиденциальность и полде…'),'','toast-demo')])}<div style="text-align:center;font-size:11px;color:#be443d;font-weight:750;padding:7px">${T('Sign out','Выйти')}</div>`}
function appearance(){return `${sec(T('THEME','ТЕМА'))}<div class="phone-segment">${[['light',T('Light','Светлая')],['dark',T('Dark','Тёмная')],['system',T('System','Как в системе')]].map(([k,label])=>`<button class="${state.appearanceTheme===k?'active':''}" data-theme="${k}">${label}</button>`).join('')}</div>${sec(T('ACCENT','АКЦЕНТ'))}<div class="phone-row" style="padding:3px 0 12px">${['#de5d1d','#6c58ca','#4c7acc','#55966d','#a53f77'].map(col=>`<button type="button" data-action="toast-demo" style="background:${col};width:29px;height:29px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #dedce7"></button>`).join('')}</div>${sec(T('TEXT SIZE','РАЗМЕР ТЕКСТА'))}<div class="phone-card"><span>A</span><input type="range" min="0" max="100" value="50" style="width:80%;accent-color:var(--orange)" aria-label="Font size" /><span style="font-size:16px"> A</span><p>${T('This is how text appears in tasks and notes.','Так будет выглядеть текст в задачах и заметках.')}</p></div>${sec(T('HOME','ГЛАВНАЯ'))}${group([line('home',T('Daily overview at the top','Сводка дня сверху'),T('Customize the Today screen','Настройте экран Сегодня'),'toast-demo')])}`}
function welcome(){return `<div style="padding-top:70px">${av('L','violet')}<h2 style="font-size:22px;line-height:1.1">${T('Home, work and family in one place','Дом, работа и семья — в одном месте')}</h2><p class="phone-meta" style="font-size:11px">${T('Tasks, budget, calendar and notes for you and your people.','Задачи, бюджет, календарь и заметки для вас и близких.')}</p><div class="phone-quick-grid">${['check','wallet','calendar','note'].map(x=>`<div class="phone-quick">${mini(x)}</div>`).join('')}</div><div style="margin-top:80px;display:grid;gap:9px"><button class="phone-action" style="height:53px" data-go="today">${T('Sign in','Войти')}</button><button class="phone-action secondary" style="height:53px" data-go="today">${T('Create account','Создать аккаунт')}</button><button class="phone-icon-btn" style="margin:auto;font-size:11px" data-go="today">${T('Continue without account','Продолжить без аккаунта')}</button></div></div>`}
function contentFor(screen){switch(screen){case'today':return today();case'spaces':return spaces();case'workspace':return workspace();case'tasks':return tasks();case'tasknew':return tasknew();case'plans':return plans();case'notes':return notes();case'finance':return finance();case'expense':return expense();case'calendar':return calendar();case'contacts':return contacts();case'medications':return medications();case'inbox':return inbox();case'assistant':return assistant();case'automation':return automation();case'profile':return profile();case'appearance':return appearance();case'welcome':return welcome();default:return today();}}
function sheet(){return `<div class="phone-overlayer"><button class="phone-sheet-dismiss" data-action="close" aria-label="Close"></button><div class="phone-sheet"><div class="phone-sheet-handle"></div>${state.modal==='widgets'?`<h4>${T('Customize widgets','Настроить виджеты')}</h4><p class="phone-meta">${T('Choose which widgets appear in Today.','Выберите, что показывать на экране «Сегодня».')}</p><div class="phone-segment">${[['week',T('Week','Неделя')],['month',T('Month','Месяц')]].map(([id,label])=>`<button type="button" class="${state.phoneWidgetPeriod===id?'active':''}" data-action="widget-period-${id}">${label}</button>`).join('')}</div><div class="phone-widget-options">${[['tasks','check',T('Tasks','Задачи')],['finance','wallet',T('Expenses','Расходы')],['calendar','calendar',T('Calendar','Календарь')],['notes','note',T('Notes','Заметки')],['medications','pill',T('Medications','Лекарства')]].map(([key,icon,label])=>`<button type="button" data-action="phone-widget-${key}" class="phone-widget-option" aria-pressed="${!!state.phoneWidgets[key]}">${mini(icon)}<span>${label}</span><span class="phone-switch ${state.phoneWidgets[key]?'on':''}"></span></button>`).join('')}</div><button type="button" class="phone-action phone-widget-done" data-action="close">${T('Done','Готово')}</button>`:state.modal==='rule-review'?`<h4>${T('Automation details','Настройки автоматизации')}</h4><p class="phone-meta">${T('An example of a When → Then rule.','Пример правила «Когда → Что».')}</p><div class="phone-subdued-card">${T('When a course ends in five days','Когда до конца курса пять дней')}</div><div class="phone-subdued-card">${T('Create a task to buy medication','Создать задачу о покупке лекарства')}</div><button type="button" class="phone-action phone-widget-done" data-action="toggle-medication">${state.rules.medication?T('Pause rule','Отключить правило'):T('Enable rule','Включить правило')}</button>`:state.modal==='create'?`<h4>${T('Create','Создать')}</h4><div class="space-select phone-meta"><span>${T('Choose a tool','Выберите инструмент')}</span>${badge(T('Home & family','Дом и семья')+' ﹀')}</div><div class="sheet-grid">${[['check',T('Task','Задача'),'tasknew'],['plan',T('Plan','План'),'plans'],['wallet',T('Expense','Расход'),'expense'],['note',T('Note','Заметка'),'notes'],['users',T('Contact','Контакт'),'contacts'],['pill',T('Medication','Лекарство'),'medications']].map(([i,label,go])=>`<button type="button" data-go="${go}">${I(i)}${label}</button>`).join('')}</div>`:state.modal==='search'?`<h4>${T('Search','Поиск')}</h4><div class="phone-field">${I('search')}<input autofocus placeholder="${T('Search everything','Поиск по всем данным')}" aria-label="Search" style="background:transparent;border:0;width:100%;outline:none" value="${txt(state.searchTerm)}" id="phone-search-input"/></div><p class="phone-meta">${T('Tasks · Contacts · Notes','Задачи · Контакты · Заметки')}</p>${group([line('check',T('Book a dentist for the child','Записать ребёнка к стоматологу'),T('Task · Today','Задача · сегодня'),'toast-demo'),line('users',T('Pediatric dentistry','Детская стоматология'),T('Contact','Контакт'),'toast-demo')])}`:`<h4>${T('Options','Действия')}</h4>${group([line('settings',T('Space settings','Настройки пространства'),'','toast-demo'),line('users',T('Members','Участники'),'','toast-demo')])}`}</div></div>`}
function phoneHTML(screen,{staticDemo=false}={}){
 const hasNav=['today','spaces','assistant','automation','profile'].includes(screen);
 const hasFab=['spaces','workspace','tasks','plans','notes','finance','calendar','contacts','medications','automation'].includes(screen);
 const submit=['tasknew','expense'].includes(screen);
 const content=contentFor(screen);
 const footer=submit?`<div class="phone-submit-bar"><button type="button" data-action="back">${T('Cancel','Отмена')}</button><button type="button" data-action="save" class="primary">${T('Save','Сохранить')}</button></div>`:hasNav?nav(screen):'';
 return `<div class="phone ${hasFab?'has-fab':''} ${hasNav?'':'no-nav'} phone-scroll-hidden" data-static="${staticDemo?'true':'false'}"><div class="phone-status"><span>19:20</span><div class="signal">5G <span class="signal-bars"><i></i><i></i><i></i></span></div></div>${header(screen)}<div class="phone-body ${submit?'no-bottom':''}">${content}</div>${footer}${hasFab?`<button type="button" class="phone-fab" data-action="${screen==='spaces'?'toast-demo':'showcreate'}" aria-label="Create">${I('plus')}</button>`:''}${!staticDemo&&state.modal?sheet():''}${!staticDemo&&state.toast?`<div class="phone-toast" role="status">${txt(state.toast)}</div>`:''}</div>`;
}

const LAB_CONTEXTS=[['home','home','Home','Дом'],['personal','user','Personal','Личное'],['work','bag','Work','Работа']];
const LAB_WIDGETS=[['tasks','check','Tasks','Задачи'],['finance','wallet','Expenses','Расходы'],['calendar','calendar','Calendar','Календарь'],['notes','note','Notes','Заметки']];
const LAB_EXAMPLES={
  home:{tasks:[3,9],money:['48,30','122,80'],appointment:['Pick up the package','Забрать посылку'],note:['Shopping list','Список покупок']},
  personal:{tasks:[2,6],money:['31,50','90,20'],appointment:['Read for 30 minutes','Почитать 30 минут'],note:['Gift ideas','Идеи подарков']},
  work:{tasks:[5,14],money:['210,00','840,00'],appointment:['Review project milestones','Проверить этапы проекта'],note:['Meeting notes','Заметки встречи']}
};
function renderWidgetLab(){
  const nav=document.getElementById('lab-spaces'),periods=document.getElementById('lab-periods'),toggles=document.getElementById('lab-widget-toggles'),view=document.getElementById('lab-view');
  if(!nav||!periods||!toggles||!view)return;
  nav.innerHTML=LAB_CONTEXTS.map(([id,icon,en,ru])=>`<button type="button" data-lab-space="${id}" aria-pressed="${state.labSpace===id}" class="${state.labSpace===id?'active':''}">${I(icon)}${T(en,ru)}</button>`).join('');
  periods.innerHTML=[['week',T('Week','Неделя')],['month',T('Month','Месяц')]].map(([id,label])=>`<button type="button" data-lab-period="${id}" aria-pressed="${state.labPeriod===id}" class="${state.labPeriod===id?'active':''}">${label}</button>`).join('');
  toggles.innerHTML=LAB_WIDGETS.map(([id,icon,en,ru])=>`<button type="button" data-lab-widget="${id}" aria-pressed="${!!state.labWidgets[id]}" class="lab-widget-toggle ${state.labWidgets[id]?'active':''}">${I(icon)}${T(en,ru)}${state.labWidgets[id]?I('check'):I('plus')}</button>`).join('');
  const data=LAB_EXAMPLES[state.labSpace],i=state.labPeriod==='week'?0:1;
  const cards={
    tasks:`<div class="lab-widget-card"><span class="lab-card-title">${I('check')} ${T('Open tasks','Актуальные задачи')}</span><strong class="lab-value">${data.tasks[i]}</strong><span class="lab-card-sub">${T('Across this space','В этом пространстве')}</span><div class="lab-progress"><i style="width:${state.labPeriod==='week'?67:42}%"></i></div></div>`,
    finance:`<div class="lab-widget-card"><span class="lab-card-title">${I('wallet')} ${T('Expenses','Расходы')}</span><strong class="lab-value">${data.money[i]} <small>$</small></strong><span class="lab-card-sub">${state.labPeriod==='week'?T('This week','За неделю'):T('This month','За месяц')}</span><div class="lab-chart">${[40,68,49,90,57,72,45].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></div>`,
    calendar:`<div class="lab-widget-card lab-widget-wide"><span class="lab-card-title">${I('calendar')} ${T('Coming up','Ближайшее')}</span><div class="lab-calendar-row"><span class="lab-day"><b>28</b><small>${T('OCT','ОКТ')}</small></span><div><strong>${T(data.appointment[0],data.appointment[1])}</strong><span class="lab-card-sub">${T('Space calendar · upcoming','Календарь пространства · скоро')}</span></div></div></div>`,
    notes:`<div class="lab-widget-card lab-widget-wide"><span class="lab-card-title">${I('note')} ${T('Selected note','Важная заметка')}</span><div class="lab-calendar-row"><span class="lab-note-badge">${I('note')}</span><div><strong>${T(data.note[0],data.note[1])}</strong><span class="lab-card-sub">${T('Keep details within reach','Всё нужное под рукой')}</span></div></div></div>`
  };
  view.innerHTML=LAB_WIDGETS.filter(([key])=>state.labWidgets[key]).map(([key])=>cards[key]).join('')||`<div class="lab-empty">${I('plus')}<strong>${T('Make it your own','Настройте под себя')}</strong><p>${T('Choose a widget above to build your view.','Выберите виджет выше, чтобы собрать свой обзор.')}</p></div>`;
}

function renderStatic(){const p=document.getElementById('hero-primary'),s=document.getElementById('hero-secondary');if(p)p.innerHTML=phoneHTML('today',{staticDemo:true});if(s)s.innerHTML=phoneHTML('workspace',{staticDemo:true});}
function renderPicker(){const el=document.getElementById('screen-picker');if(!el)return;el.innerHTML=SCREEN_META.map(([id,icon,en,ru])=>`<button type="button" class="screen-choice ${state.screen===id?'active':''}" data-screen="${id}" aria-pressed="${state.screen===id}">${I(icon)}${T(en,ru)}</button>`).join('');}
function renderShowcase(){const el=document.getElementById('showcase-phone');if(!el)return;el.innerHTML=phoneHTML(state.screen);renderPicker();const i=SCREENS.indexOf(state.screen);const meta=SCREEN_META.find(x=>x[0]===state.screen);const title=document.getElementById('preview-description-title'),desc=document.getElementById('preview-description-text'),cnt=document.getElementById('preview-counter');if(meta){title.textContent=T(meta[2],meta[3]);desc.textContent=T(meta[4],meta[5]);cnt.textContent=`${String(i+1).padStart(2,'0')} / ${String(SCREEN_META.length).padStart(2,'0')}`;}}
function translateSite(){document.documentElement.lang=state.lang;for(const el of document.querySelectorAll('[data-t]')){const key=el.dataset.t;if(SITE_COPY[state.lang][key])el.textContent=SITE_COPY[state.lang][key];}document.querySelectorAll('[data-lang]').forEach(el=>{el.classList.toggle('active',el.dataset.lang===state.lang);el.setAttribute('aria-pressed',String(el.dataset.lang===state.lang));});document.title=state.lang==='ru'?'LADNIK | Ваше пространство. Ваши правила.':'LADNIK | Your space. Your way.';}
function go(screen,scroll=false){state.screen=screen;state.modal=null;state.toast=null;state.assistantTab=screen==='automation'?'automation':'chat';renderShowcase();if(scroll)document.getElementById('preview').scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function notify(text){state.modal=null;state.toast=text;renderShowcase();}
function handleClick(e){const lang=e.target.closest('[data-lang]');if(lang){state.lang=lang.dataset.lang;translateSite();renderStatic();renderShowcase();renderWidgetLab();return;}
  const labSpace=e.target.closest('[data-lab-space]');if(labSpace){state.labSpace=labSpace.dataset.labSpace;renderWidgetLab();return;}
  const labPeriod=e.target.closest('[data-lab-period]');if(labPeriod){state.labPeriod=labPeriod.dataset.labPeriod;renderWidgetLab();return;}

 const filter=e.target.closest('[data-filter]');if(filter&&filter.closest('#showcase-phone')){state.taskFilter=filter.dataset.filter;renderShowcase();return;}
 const noteFilter=e.target.closest('[data-notes-filter]');if(noteFilter&&noteFilter.closest('#showcase-phone')){state.notesFilter=noteFilter.dataset.notesFilter;renderShowcase();return;}
 const fin=e.target.closest('[data-finance-tab]');if(fin&&fin.closest('#showcase-phone')){state.financeTab=fin.dataset.financeTab;renderShowcase();return;}
 const theme=e.target.closest('[data-theme]');if(theme&&theme.closest('#showcase-phone')){state.appearanceTheme=theme.dataset.theme;renderShowcase();return;}
 const act=e.target.closest('[data-action]');if(act&&!act.closest('#showcase-phone'))return;
 if(!act)return;
 const action=act.dataset.action;
 if(action==='back'){go(['tasknew','expense'].includes(state.screen)?'today':state.screen==='appearance'?'profile':'workspace');return;}
 if(action==='inbox'){go('inbox');return;}
 if(action==='workspace'){go('workspace');return;}
 if(action==='customize-widgets'){state.modal='widgets';renderShowcase();return;}
 if(action.startsWith('phone-widget-')){const key=action.slice('phone-widget-'.length);if(key in state.phoneWidgets){state.phoneWidgets[key]=!state.phoneWidgets[key];renderShowcase();renderStatic();}return;}
 if(action.startsWith('widget-period-')){state.phoneWidgetPeriod=action.slice('widget-period-'.length);renderShowcase();renderStatic();return;}
 if(action==='toggle-overdue'){state.rules.overdue=!state.rules.overdue;renderShowcase();return;}
 if(action==='toggle-medication'){state.rules.medication=!state.rules.medication;state.modal=null;renderShowcase();return;}
 if(action==='review-rule'){state.modal='rule-review';renderShowcase();return;}
 if(action==='showcreate'||action==='morecreate'){state.modal='create';renderShowcase();return;}
 if(action==='search'){state.modal='search';renderShowcase();document.getElementById('phone-search-input')?.focus();return;}
 if(action==='more'){state.modal='more';renderShowcase();return;}
 if(action==='close'){state.modal=null;renderShowcase();return;}
 if(action==='tasknew'){go('tasknew');return;}
 if(action==='expense'){go('expense');return;}
 if(action==='notes'){go('notes');return;}
 if(action==='save'){go(state.screen==='expense'?'finance':'tasks');return;}

 if(action==='chat'){state.assistantTab='chat';go('assistant');return;}
 if(action==='automations'){state.assistantTab='automation';go('automation');return;}

}
function handleInput(e){if(!e.target.closest('#showcase-phone'))return;const pl=e.target.closest('[data-plan]'),no=e.target.closest('[data-note]');if(pl){state.planDone[Number(pl.dataset.plan)]=pl.checked;renderShowcase();}if(no){state.notesDone[Number(no.dataset.note)]=no.checked;renderShowcase();}if(e.target.id==='phone-search-input')state.searchTerm=e.target.value;}

function submitExampleChat(e){
  if(e.target.id!=='phone-chat-form')return;
  e.preventDefault();
  const input=e.target.querySelector('#phone-chat-input');const value=(input?.value||'').trim();if(!value)return;
  const clean=value.slice(0,180);const lower=clean.toLowerCase();
  state.chatMessages.push({from:'mine',en:clean,ru:clean});
  let en,ru;
  if(/expense|budget|money|finance|расход|бюджет|финанс|траты|деньг|такси/.test(lower)){
    en='Here is your example summary: expenses this week are 48.30 $. Open Finances for details.';
    ru='Пример сводки: расходы за неделю — 48,30 $. Подробности есть в финансах.';
  }else if(/note|список|замет|покупк/.test(lower)){
    en='Your Shopping list is in Notes: milk, bread, apples and cheese.';
    ru='Список покупок в заметках: молоко, хлеб, яблоки и сыр.';
  }else if(/task|plan|дел|задач|план|срок/.test(lower)){
    en='Your example space has 3 active tasks, including one overdue. You can open Tasks to review them.';
    ru='В этом примере 3 активные задачи, одна просрочена. Откройте «Задачи», чтобы посмотреть их.';
  }else{
    en='Your home space combines tasks, notes, expenses and dates. Try asking about tasks or spending.';
    ru='В домашнем пространстве собраны задачи, заметки, расходы и даты. Попробуйте спросить про задачи или траты.';
  }
  state.chatMessages.push({from:'bot',en,ru});
  renderShowcase();
  const body=document.querySelector('#showcase-phone .phone-body');if(body)body.scrollTop=body.scrollHeight;
  document.getElementById('phone-chat-input')?.focus();
}

function next(delta){const i=SCREENS.indexOf(state.screen);const j=i===-1?0:i;go(SCREENS[(j+delta+SCREENS.length)%SCREENS.length]);}

const LANGUAGE_KEY='ladnik-language';
function readWikiLanguage(){const value=new URL(location.href).searchParams.get('lang');if(['ru','en'].includes(value))return value;try{const saved=localStorage.getItem(LANGUAGE_KEY);if(['ru','en'].includes(saved))return saved;}catch{}return 'ru';}
let wikiLang=readWikiLanguage(),wikiChapter='start';
const wikiChapters=()=>wikiLang==='en'?WIKI_EN:WIKI;
const chapterById=id=>wikiChapters().find(c=>c.id===id);
const WT=(en,ru)=>wikiLang==='en'?en:ru;
function updateWikiChrome(){
 document.documentElement.lang=wikiLang;
 try{localStorage.setItem(LANGUAGE_KEY,wikiLang);}catch{}
 document.querySelector('.wiki-sidebar-label').textContent=WT('APPLICATION GUIDE','ИНСТРУКЦИЯ');
 const search=document.getElementById('wiki-search');search.placeholder=WT('Search the guide…','Поиск по инструкции…');search.setAttribute('aria-label',WT('Search guide sections','Поиск по разделам'));
 document.getElementById('wiki-nav').setAttribute('aria-label',WT('Guide sections','Разделы инструкции'));
 document.getElementById('wiki-no-results').textContent=WT('No results. Try notes, dates or widgets.','Ничего не найдено. Попробуйте «заметки», «срок» или «виджеты».');
 document.querySelector('.wiki-sidebar-foot').innerHTML=WT('<b>Application reference</b>Sections and common actions.','<b>Справка по приложению</b>Разделы и основные действия.');
 document.querySelector('.wiki-preview-head b').textContent=WT('SECTION SCREEN','ЭКРАН РАЗДЕЛА');
 document.getElementById('wiki-reset').innerHTML=I('back')+WT('Reset','Сначала');
 document.getElementById('wiki-menu-toggle').innerHTML=WT('Sections and search','Разделы и поиск')+I('grid');
 document.querySelector('.wiki-skip').textContent=WT('Skip to content','Перейти к содержимому');
 document.getElementById('wiki-screen-tabs').setAttribute('aria-label',WT('Choose a screen','Выбрать экран'));
 document.getElementById('wiki-pager').setAttribute('aria-label',WT('Section navigation','Переход между разделами'));
 const home='index.html?lang='+wikiLang;
 const brand=document.querySelector('.wiki-brand');brand.href=home;brand.setAttribute('aria-label',WT('LADNIK — home page','LADNIK — главная страница'));
 const back=document.querySelector('.wiki-home');back.href=home;back.innerHTML=I('back')+WT('Home','На сайт');
 document.querySelectorAll('[data-wiki-language]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.wikiLanguage===wikiLang);btn.setAttribute('aria-pressed',String(btn.dataset.wikiLanguage===wikiLang));});
 document.querySelector('meta[name="description"]').content=WT('LADNIK WIKI — instructions for spaces, tasks, notes, finances and settings, with screen examples.','LADNIK WIKI — инструкция по пространствам, задачам, заметкам, финансам и настройкам с примерами экранов.');
}
function screenChapter(screen){return {today:'start',welcome:'start',spaces:'spaces',workspace:'spaces',tasks:'tasks',plans:'tasks',tasknew:'tasks',notes:'notes',finance:'money',expense:'money',calendar:'daily',contacts:'daily',medications:'daily',assistant:'assistant',automation:'assistant',profile:'settings',appearance:'settings',inbox:'settings'}[screen]||wikiChapter;}
function renderShowcase(){const view=document.getElementById('showcase-phone');if(!view)return;view.innerHTML=phoneHTML(state.screen);const c=chapterById(wikiChapter);document.getElementById('wiki-screen-tabs').innerHTML=c.screens.map(([screen,label])=>`<button type="button" data-wiki-screen="${screen}" aria-pressed="${state.screen===screen}">${label}</button>`).join('');document.getElementById('wiki-try-text').textContent=c.tryText;}
function go(screen){const nextChapter=screenChapter(screen);if(nextChapter!==wikiChapter){openChapter(nextChapter,{screen});return;}state.screen=screen;state.modal=null;state.toast=null;state.assistantTab=screen==='automation'?'automation':'chat';renderShowcase();}
function renderWikiNav(){document.getElementById('wiki-nav').innerHTML=wikiChapters().map(c=>`<a href="#${c.id}" data-wiki-chapter="${c.id}" ${c.id===wikiChapter?'aria-current="page"':''}>${I(c.icon)}<span>${c.label}</span></a>`).join('');filterWiki(document.getElementById('wiki-search').value);}
function openChapter(id,{screen=null,writeHash=true,scroll=true}={}){
 const all=wikiChapters(),c=chapterById(id)||all[0];wikiChapter=c.id;const index=all.indexOf(c);state.lang=wikiLang;state.screen=screen||c.screens[0][0];state.modal=null;state.toast=null;state.assistantTab=state.screen==='automation'?'automation':'chat';updateWikiChrome();document.title=`${c.label} — LADNIK WIKI`;
 document.getElementById('wiki-current-label').textContent=c.label;document.getElementById('wiki-topic-index').textContent=`${String(index+1).padStart(2,'0')} / ${String(all.length).padStart(2,'0')}`;document.getElementById('wiki-kicker').textContent=c.eyebrow;document.getElementById('wiki-title').textContent=c.title;document.getElementById('wiki-intro').textContent=c.intro;
 document.getElementById('wiki-article').innerHTML=c.sections.map(([title,body])=>`<section class="wiki-section"><h2>${title}</h2>${body}</section>`).join('')+`<section class="wiki-steps"><h2>${WT('Steps','Порядок действий')}</h2><ol>${c.steps.map(step=>`<li>${step}</li>`).join('')}</ol></section><aside class="wiki-note">${c.note}</aside><div class="wiki-related"><span>${WT('Related sections','Связанные разделы')}</span>${c.related.map(id=>`<a href="#${id}">${chapterById(id).label}</a>`).join('')}</div>`;
 const prev=all[index-1],next=all[index+1];document.getElementById('wiki-pager').innerHTML=(prev?`<a href="#${prev.id}">${I('back')}<span><small>${WT('Previous section','Предыдущий раздел')}</small>${prev.label}</span></a>`:'')+(next?`<a class="next" href="#${next.id}"><span><small>${WT('Next section','Следующий раздел')}</small>${next.label}</span>${I('arrow')}</a>`:`<a class="next" href="#start"><span><small>${WT('Return','Вернуться')}</small>${WT('Getting started','Начало работы')}</span>${I('arrow')}</a>`);
 renderWikiNav();renderShowcase();const url=new URL(location.href);url.searchParams.set('lang',wikiLang);url.hash=c.id;if(writeHash&&location.hash!==url.hash)history.pushState(null,'',url);else history.replaceState(null,'',url);
 document.getElementById('wiki-sidebar').classList.remove('is-open');document.getElementById('wiki-menu-toggle').setAttribute('aria-expanded','false');if(scroll){window.scrollTo({top:0,behavior:'instant'});document.getElementById('wiki-title').focus({preventScroll:true});}
}
function filterWiki(value){const q=value.toLocaleLowerCase(wikiLang).replace(/ё/g,'е').trim();let found=0;document.querySelectorAll('[data-wiki-chapter]').forEach(link=>{const c=chapterById(link.dataset.wikiChapter);const all=[c.label,c.title,c.intro,...c.sections.flat(),...c.steps,c.note].join(' ').replace(/<[^>]*>/g,' ').toLocaleLowerCase(wikiLang).replace(/ё/g,'е');link.hidden=q!==''&&!all.includes(q);if(!link.hidden)found++;});document.getElementById('wiki-no-results').hidden=found!==0;}
function resetWikiPreview(){state.taskDone={};state.planDone={0:true,1:true};state.notesDone={0:true,1:true};state.notesFilter='all';state.taskFilter='all';state.financeTab='expenses';state.medTaken=false;state.chatMessages=[];state.rules={overdue:true,medication:false};state.phoneWidgets={finance:true,medications:true,calendar:true,notes:false,tasks:false};state.appearanceTheme='light';state.showTip=true;state.phoneWidgetPeriod='week';state.searchTerm='';state.viewSpace='home';go(chapterById(wikiChapter).screens[0][0]);}
function wikiClick(e){
 const language=e.target.closest('[data-wiki-language]');if(language){wikiLang=language.dataset.wikiLanguage;document.getElementById('wiki-search').value='';openChapter(wikiChapter,{screen:state.screen,writeHash:false,scroll:false});return;}
 const screen=e.target.closest('[data-wiki-screen]');if(screen){go(screen.dataset.wikiScreen);return;}
 const a=e.target.closest('a[href^="#"]');if(a?.classList.contains('wiki-skip')){e.preventDefault();document.getElementById('wiki-title').focus();return;}if(a&&chapterById(a.hash.slice(1))){e.preventDefault();openChapter(a.hash.slice(1));return;}
 if(e.target.closest('#wiki-reset')){resetWikiPreview();return;}
 if(e.target.closest('#wiki-menu-toggle')){const open=document.getElementById('wiki-sidebar').classList.toggle('is-open');document.getElementById('wiki-menu-toggle').setAttribute('aria-expanded',String(open));return;}
 const generic=e.target.closest('[data-action^="toast"]');if(generic&&generic.closest('#showcase-phone')){const title=(generic.querySelector('.title')?.textContent||generic.querySelector('b')?.textContent||generic.textContent).trim();const description=generic.querySelector('.subtitle')?.textContent||'';const detail=document.createElement('div');detail.className='phone-overlayer';detail.innerHTML=`<button class="phone-sheet-dismiss" type="button" data-wiki-close aria-label="${WT('Close','Закрыть')}"></button><section class="phone-sheet"><div class="phone-sheet-handle"></div><h4 class="wiki-detail-title">${txt(title)}</h4><p class="wiki-detail">${txt(description||chapterById(wikiChapter).sections[0][0])}</p><button class="phone-action" data-wiki-close type="button">${WT('Done','Готово')}</button></section>`;document.querySelector('#showcase-phone .phone').append(detail);return;}
 const close=e.target.closest('[data-wiki-close]');if(close){close.closest('.phone-overlayer').remove();return;}handleClick(e);
}
document.addEventListener('DOMContentLoaded',()=>{openChapter(location.hash.slice(1)||'start',{writeHash:false,scroll:false});document.addEventListener('click',wikiClick);document.addEventListener('change',handleInput);document.addEventListener('input',handleInput);document.addEventListener('submit',submitExampleChat);document.getElementById('wiki-search').addEventListener('input',e=>filterWiki(e.target.value));document.getElementById('wiki-search').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';filterWiki('');}if(e.key==='Enter'){const first=document.querySelector('[data-wiki-chapter]:not([hidden])');if(first){e.target.value='';openChapter(first.dataset.wikiChapter);}}});window.addEventListener('hashchange',()=>{wikiLang=readWikiLanguage();openChapter(location.hash.slice(1),{writeHash:false});});document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.modal=null;state.toast=null;renderShowcase();}});});
